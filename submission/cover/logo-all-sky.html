<!doctype html><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0}body{width:1920px;height:1080px;overflow:hidden;position:relative;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.18)}
.plate{position:absolute;left:50%;top:50%;width:1500px;height:330px;transform:translate(-50%,-50%);border-radius:36px;background:rgba(3,8,17,.58);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 90px rgba(0,0,0,.55)}
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font:800 160px Inter,sans-serif;letter-spacing:-.035em;color:#fff;filter:drop-shadow(0 8px 30px rgba(0,0,0,.85))}
.lock img{width:370px;height:370px;margin-left:-70px}.lock b{color:#5ef2ff;font-weight:800}</style>
<img class="bg" src="nasa-spherex-all-sky.jpg"><div class="shade"></div><div class="plate"></div><div class="lock"><img src="../logo/blinking-sky-logo-white.png"><span>Blinking <b>Sky</b></span></div>
